<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotos 3901</title>
</head>
<p>Pintura</p>
<body>
<center>

  <img id="foto" src="foto/foto1.jpg" style="max-width: 100%; width: 400px; height: 300px; object-fit: contain;"><br><br>

  <button onclick="i = i > 1 ? i - 1 : 490; atualizarFoto()">❮</button>
  
  <button onclick="i = i < 490 ? i + 1 : 1; atualizarFoto()">❯</button>

  <br><br>

  <a id="btnDownload" href="foto/foto1.jpg" download="foto1.jpg">
    <button>Baixar</button>
  </a>

<!-- Botão para abrir a página de vídeos -->
 <br> <a href="videos.html">
    <button>Ver Vídeos</button>
  </a>


  <script>
    let i = 1;

    function atualizarFoto() {
      let caminho = 'foto/foto' + i + '.jpg';
      
      foto.src = caminho;
      
      let btn = document.getElementById('btnDownload');
      btn.href = caminho;
      btn.download = 'foto' + i + '.jpg';
    }
  </script>

</center>
</body>
</html>

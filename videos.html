<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vídeos 3901</title>
</head>

<body>
<center>

  <!-- Adicionado playsinline e preload para facilitar o carregamento no Android -->
  <video id="videoPlayer" src="" width="400" style="max-width: 100%; height: 300px; object-fit: contain;" controls playsinline preload="auto">
    Seu navegador não suporta vídeos.
  </video><br><br>

  <button onclick="mudarVideo(-1)">❮</button>
  <button onclick="mudarVideo(1)">❯</button>

  <br><br>

  <a id="btnDownload" href="#" download="">
    <button>Baixar Vídeo</button>
  </a>

  <br><br><br>

  <a href="index.html">
    <button>Voltar para Fotos</button>
  </a>

  <script>
    // Coloque aqui os nomes exatos dos seus arquivos (sem o .mp4)
    let listaVideos = [
      "video1",
      "video2_sem_audio",
      "3"
    ];

    let v = 0;

    function atualizarVideo() {
      let nomeArquivo = listaVideos[v] + ".mp4";
      let caminho = "videos/" + nomeArquivo;
      let player = document.getElementById('videoPlayer');
      
      player.src = caminho;
      player.load();
      
      let btn = document.getElementById('btnDownload');
      btn.href = caminho;
      btn.download = nomeArquivo;
    }

    function mudarVideo(direcao) {
      v += direcao;

      if (v >= listaVideos.length) {
        v = 0;
      } else if (v < 0) {
        v = listaVideos.length - 1;
      }

      atualizarVideo();
    }

    window.onload = function() {
      atualizarVideo();
    };
  </script>

</center>
</body>
</html>

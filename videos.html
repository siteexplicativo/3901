<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vídeos 3901</title>
</head>

<body>
<center>

  <!-- O src agora fica direto na tag video -->
  <video id="videoPlayer" src="videos/video1.mp4" width="400" style="max-width: 100%; height: 300px; object-fit: contain;" controls>
    Seu navegador não suporta vídeos.
  </video><br><br>

  <button onclick="v = v > 1 ? v - 1 : totalVideos; atualizarVideo()">❮</button>
  
  <button onclick="v < totalVideos ? v++ : v = 1; atualizarVideo()">❯</button>

  <br><br>

  <a id="btnDownload" href="videos/video1.mp4" download="video1.mp4">
    <button>Baixar Vídeo</button>
  </a>

  <br><br><br>

  <a href="index.html">
    <button>Voltar para Fotos</button>
  </a>

  <script>
    let v = 1;
    let totalVideos = 10; // Altere para a quantidade exata de vídeos na pasta "videos"

    function atualizarVideo() {
      let caminho = 'videos/video' + v + '.mp4';
      let player = document.getElementById('videoPlayer');
      
      // Altera o src diretamente e força o play/load
      player.src = caminho;
      player.load();
      
      let btn = document.getElementById('btnDownload');
      btn.href = caminho;
      btn.download = 'video' + v + '.mp4';
    }
  </script>

</center>
</body>
</html>

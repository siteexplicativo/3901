<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vídeos 3901</title>
</head>

<body>
<center>
 
  <video id="videoPlayer" src="videos/video2_sem_audio.mp4" width="400" style="max-width: 100%; height: 300px; object-fit: contain;" controls playsinline preload="auto">

    Seu navegador não suporta vídeos.
  </video><br><br>
<span id="contadorVideo" style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold;">1 / 10</span><br>
  <button onclick="mudarVideo(-1)">❮</button>
  <button onclick="mudarVideo(1)">❯</button>

  <br><br>

  <a id="btnDownload" href="videos/video2_sem_audio.mp4" download="video2_sem_audio.mp4">
    <button>Baixar Vídeo</button>
  </a>

  <br><br><br>

  <a href="index.html">
    <button>Voltar para Fotos</button>
  </a>

  <script>
    let v = 2; // Começa no número 2 (ou 1, dependendo de qual é o primeiro)
    let totalVideos = 10; // Altere para a quantidade total de vídeos

    function atualizarVideo() {
      let nomeArquivo = 'video' + v + '_sem_audio.mp4';
      let caminho = 'videos/' + nomeArquivo;
      let player = document.getElementById('videoPlayer');
      
      player.src = caminho;
      player.load();
      
      // Atualiza o contador de vídeos
      document.getElementById('contadorVideo').innerText = v + ' / ' + totalVideos;
      
      let btn = document.getElementById('btnDownload');
      btn.href = caminho;
      btn.download = nomeArquivo;
    }

    function mudarVideo(direcao) {
      if (direcao === 1) {
        v = v < totalVideos ? v + 1 : 2; // Se passar do total, volta para o primeiro (2)
      } else {
        v = v > 2 ? v - 1 : totalVideos;
      }

      atualizarVideo();
    }
  </script>

</center>
</body>
</html>

<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vídeos 3901</title>
</head>

<body>
<center>

  <video id="videoPlayer" src="" width="400" style="max-width: 100%; height: 300px; object-fit: contain;" controls>
    Seu navegador não suporta vídeos.
  </video><br><br>

  <button onclick="mudarVideo(-1)">❮</button>
  <button onclick="mudarVideo(1)">❯</button>

  <br><br>

  <a id="btnDownload" href="#" download="">
    <button>Baixar Vídeo</button>
  </a>

  <br><br><br>

  <a href="index.html">
    <button>Voltar para Fotos</button>
  </a>

  <script>
    // LISTA DE VÍDEOS: Coloque entre aspas o nome exato de cada arquivo que está na pasta "videos" (sem o .mp4)
    let listaVideos = [
      "video1",
      "video2_sem_audio",
      "outro_video_legal",
      "video_exemplo"
    ];

    let v = 0; // Começa no primeiro item da lista (posição 0)

    function atualizarVideo() {
      let nomeArquivo = listaVideos[v] + ".mp4";
      let caminho = "videos/" + nomeArquivo;
      let player = document.getElementById('videoPlayer');
      
      // Atualiza o player
      player.src = caminho;
      player.load();
      
      // Atualiza o botão de download
      let btn = document.getElementById('btnDownload');
      btn.href = caminho;
      btn.download = nomeArquivo;
    }

    function mudarVideo(direcao) {
      v += direcao;

      // Se passar do último, volta pro primeiro. Se for menor que 0, vai para o último.
      if (v >= listaVideos.length) {
        v = 0;
      } else if (v < 0) {
        v = listaVideos.length - 1;
      }

      atualizarVideo();
    }

    // Carrega o primeiro vídeo assim que a página abre
    window.onload = function() {
      atualizarVideo();
    };
  </script>

</center>
</body>
</html>
